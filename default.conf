server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Where your website's static files live inside the container
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Gzip compression for faster loading times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    
    add_header Last-Modified $date_gmt;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    if_modified_since off;
    expires off;
    etag off;

    location / {
        # Essential for Single Page Apps (React, Vue, Angular)
        # It redirects missing paths back to index.html so frontend routing works
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (optional but recommended)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Handle server error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}